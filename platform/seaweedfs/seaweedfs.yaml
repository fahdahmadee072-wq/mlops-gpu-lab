apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: storage
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path        # k3s built-in: real disk under /var/lib/rancher/k3s/storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: storage
spec:
  replicas: 1
  strategy:
    type: Recreate                    # one disk, one pod — never two at once
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      - name: weed
        image: localhost:5000/seaweedfs:4.48
        args:
        - server
        - -dir=/data                          # where the bytes go (the PVC)
        - -s3                                 # turn on the S3 gateway
        - -s3.port=8333
        - -s3.config=/etc/seaweedfs/s3.json   # the login keys
        - -master.volumeSizeLimitMB=1024      # keep internal chunks small for a laptop
        ports:
        - containerPort: 8333
          name: s3
        readinessProbe:
          tcpSocket:
            port: 8333
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
        - name: s3-config
          mountPath: /etc/seaweedfs
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seaweedfs-data
      - name: s3-config
        secret:
          secretName: seaweedfs-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: storage
spec:
  selector:
    app: seaweedfs
  ports:
  - port: 8333
    targetPort: 8333
    name: s3
